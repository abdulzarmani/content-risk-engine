services:
  safety-kit:
    build: .
    ports:
      - "${API_PORT:-5000}:${API_PORT:-5000}"
    env_file:
      - path: .env
        required: false
    environment:
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-5000}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('API_PORT', '5000') + '/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
      